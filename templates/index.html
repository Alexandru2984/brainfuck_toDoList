<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainfuck Todo List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <script defer src="https://analytics.micutu.com/script.js" data-website-id="6ccf54d7-10de-4daf-9882-23dc1ff95ffd"></script>
</head>
<body class="app-shell">
    <header class="topbar">
        <div>
            <p class="eyebrow">Brainfuck Todo</p>
            <h1>BF Todo Formatter</h1>
        </div>
        <form action="{{ url_for('logout') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="ghost-button">Logout</button>
        </form>
    </header>

    <section class="compose panel">
        <form action="{{ url_for('add') }}" method="POST" class="task-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="task" aria-label="Task nou" placeholder="Adauga un task nou..." required autocomplete="off" maxlength="{{ max_task_length }}">
            <button type="submit" class="primary-button">Adauga</button>
        </form>
    </section>
    
    <section class="task-list" aria-label="Taskuri">
        {% for todo in todos %}
            <div class="task-wrapper">
                {{ todo.html | safe }}
                <form action="{{ url_for('delete', id=todo.id) }}" method="POST" class="delete-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="delete-btn" aria-label="Sterge task">&times;</button>
                </form>
            </div>
        {% else %}
            <div class="empty-state">Niciun task. Adauga unul mai sus.</div>
        {% endfor %}
    </section>
</body>
</html>
