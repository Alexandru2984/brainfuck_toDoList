<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Brainfuck Todo</title>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</head>
<body class="auth-shell">
    <main class="panel">
        <p class="eyebrow">Brainfuck Todo</p>
        <h1>Autentificare</h1>
        <p class="helper-text">Parola este validata de motorul Brainfuck.</p>
        
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}
        
        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="password" name="password" aria-label="Parola" placeholder="Introdu parola..." required autofocus>
            <button type="submit" class="primary-button">Login</button>
        </form>
    </main>
</body>
</html>
